        <div class="space-y-3" id="menu-list">
            <h2 class="font-bold text-gray-800 text-base border-b pb-2">เลือกรายการสั่งซื้อ</h2>
        </div>

        <!-- 3. ข้อมูลจัดส่ง -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border space-y-4 mt-6">
            <h2 class="font-bold text-gray-800 text-base border-b pb-2">ข้อมูลจัดส่ง</h2>

            <!-- ชื่อผู้รับ -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อผู้รับ</label>
                <div class="relative">
                    <input type="text" id="customer-name" oninput="saveInput('customer-name')" placeholder="ชื่อ-นามสกุล" class="w-full p-3 pr-8 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-500">
                    <button onclick="clearInput('customer-name')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 text-xs p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">เบอร์โทรศัพท์</label>
                <div class="relative">
                    <input type="tel" id="customer-phone" oninput="saveInput('customer-phone')" placeholder="080-xxx-xxxx" class="w-full p-3 pr-8 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-500">
                    <button onclick="clearInput('customer-phone')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 text-xs p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- ที่อยู่จัดส่ง -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ที่อยู่จัดส่ง / ปักหมุด GPS</label>
                <div class="flex space-x-2 mb-2">
                    <div class="relative w-full">
                        <input type="text" id="delivery-address" oninput="saveInput('delivery-address')" placeholder="ระบุบ้านเลขที่, ซอย, ถนน" class="w-full p-3 pr-8 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-500">
                        <button onclick="clearInput('delivery-address')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 text-xs p-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <button type="button" onclick="getGPS()" class="bg-orange-100 text-orange-800 px-3 py-2 rounded-xl text-xs font-bold shrink-0 flex items-center">
                        <i class="fa-solid fa-location-crosshairs mr-1"></i> GPS
                    </button>
                </div>
                <p id="gps-status" class="text-xs text-gray-400"></p>
            </div>

            <!-- หมายเหตุ -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">หมายเหตุถึงร้านค้า/ไรเดอร์</label>
                <div class="relative">
                    <textarea id="order-note" oninput="saveInput('order-note')" placeholder="เช่น เผ็ดน้อย, ไม่ใส่ผัก" class="w-full p-3 pr-8 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-500" rows="2"></textarea>
                    <button onclick="clearInput('order-note')" class="absolute right-2.5 top-3 text-gray-400 hover:text-red-500 text-xs p-1">

    <!-- แถบสรุปยอดและปุ่มสั่งซื้อ -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">ยอดรวมทั้งหมด</p>
                <p class="text-xl font-bold text-orange-600"><span id="total-price">0</span> บาท</p>
            </div>
            <button onclick="sendOrder()" class="bg-orange-600 hover:bg-orange-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition active:scale-95">
                ยืนยันการสั่งซื้อ ------------------------<i class="fa-solid fa-paper-plane ml-1"></i>
            </button>
        </div>
    </div>

    <script>
      const firebaseConfig = {
    databaseURL: "https://dudyadmit-default-rtdb.asia-southeast1.firebasedatabase.app/"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let currentMapUrl = "";

// 1. รายการเมนูอาหาร (ไม่มีรูปภาพ + กำหนดราคาธรรมดา และ ราคาพิเศษ)
const menuItems = [
    { id: 'm1', name: 'ข้าวมันไก่', priceNormal: 60, priceSpecial: 70 },
    { id: 'm2', name: 'ข้าวหมูกรอบ', priceNormal: 60, priceSpecial: 70 },
    { id: 'm3', name: 'ข้าวหมูแดง', priceNormal: 60, priceSpecial: 70 },
    { id: 'm4', name: 'ข้วขาหมู', priceNormal: 60, priceSpecial: 70 },
    { id: 'm5', name: 'ข้าวมันไก่ทอด', priceNormal: 60, priceSpecial: 70 },
    { id: 'm6', name: 'ข้าวมันรวมมิตร', priceNormal: 60, priceSpecial: 75 }
	
];

// ตัวแปรเก็บบริมาณการสั่งและประเภทราคา (normal / special)
const orderState = {};

// 2. ฟังก์ชันแสดงรายการเมนู (มี Radio ให้เลือกธรรมดา/พิเศษ)
function renderMenu() {
    const container = document.getElementById('menu-list');
    container.innerHTML = '<h2 class="font-bold text-gray-800 text-base border-b pb-2">เลือกรายการสั่งซื้อ</h2>';

    menuItems.forEach(item => {
        // ค่าเริ่มต้น
        if (!orderState[item.id]) {
            orderState[item.id] = { qty: 0, type: 'normal' };
        }

        const state = orderState[item.id];

        const itemHtml = `
            <div class="bg-white p-3.5 rounded-2xl shadow-sm border space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                    <!-- ปุ่มบวกลบจำนวน -->
                    <div class="flex items-center space-x-2 bg-gray-100 rounded-xl p-1">
                        <button onclick="updateQty('${item.id}', -1)" class="w-7 h-7 bg-white rounded-lg shadow font-bold text-gray-600 flex items-center justify-center active:scale-95">-</button>
                        <span id="qty-${item.id}" class="w-6 text-center text-sm font-bold">${state.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="w-7 h-7 bg-orange-600 text-white rounded-lg shadow font-bold flex items-center justify-center active:scale-95">+</button>
                    </div>
                </div>

                <!-- ตัวเลือก ธรรมดา / พิเศษ -->
                <div class="flex space-x-4 text-xs pt-1 border-t border-gray-50">
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="radio" name="type-${item.id}" value="normal" ${state.type === 'normal' ? 'checked' : ''} onchange="updateType('${item.id}', 'normal')" class="text-orange-600 focus:ring-orange-500">
                        <span class="text-gray-700">ธรรมดา (${item.priceNormal} ฿)</span>
                    </label>
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="radio" name="type-${item.id}" value="special" ${state.type === 'special' ? 'checked' : ''} onchange="updateType('${item.id}', 'special')" class="text-orange-600 focus:ring-orange-500">
                        <span class="text-gray-700 font-semibold text-orange-600">พิเศษ (${item.priceSpecial} ฿)</span>
                    </label>
                </div>
            </div>
        `;
        container.innerHTML += itemHtml;
    });
}

// อัปเดตจำนวน
function updateQty(id, change) {
    if (!orderState[id]) orderState[id] = { qty: 0, type: 'normal' };
    orderState[id].qty += change;
    if (orderState[id].qty < 0) orderState[id].qty = 0;

    document.getElementById(`qty-${id}`).innerText = orderState[id].qty;
    calculateTotal();
}

// อัปเดตประเภท (ธรรมดา / พิเศษ)
function updateType(id, type) {
    if (!orderState[id]) orderState[id] = { qty: 0, type: 'normal' };
    orderState[id].type = type;
    calculateTotal();
}

// คำนวณราคารวมทั้งหมด
function calculateTotal() {
    let total = 0;
    menuItems.forEach(item => {
        const state = orderState[item.id];
        if (state && state.qty > 0) {
            const price = (state.type === 'special') ? item.priceSpecial : item.priceNormal;
            total += state.qty * price;
        }
    });
    document.getElementById('total-price').innerText = total;
    return total;
}

function getGPS() {
    const status = document.getElementById('gps-status');
    if (navigator.geolocation) {
        status.innerText = "กำลังดึงพิกัด GPS...";
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentMapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            const val = `พิกัด GPS (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            document.getElementById('delivery-address').value = val;
            saveInput('delivery-address');
            status.innerHTML = `<span class="text-green-600 font-bold">✓ ดึงพิกัด GPS เรียบร้อยแล้ว</span>`;
        }, err => {
            status.innerHTML = `<span class="text-red-500">ไม่สามารถดึง GPS ได้ กรุณากรอกที่อยู่แทน</span>`;
        });
    }
}

// --- บันทึกข้อความ & ลบช่องพิมพ์ ---
const inputFields = ['customer-name', 'customer-phone', 'delivery-address', 'order-note'];

function saveInput(id) {
    const val = document.getElementById(id).value;
    localStorage.setItem(id, val);
}

function loadSavedInputs() {
    inputFields.forEach(id => {
        const savedValue = localStorage.getItem(id);
        if (savedValue !== null) {
            document.getElementById(id).value = savedValue;
        }
    });
}

function clearInput(id) {
    document.getElementById(id).value = '';
    localStorage.removeItem(id);
}

// ฟังก์ชันส่งออเดอร์เข้า Firebase
function sendOrder() {
    const name = document.getElementById('customer-name').value;
    const phone = document.getElementById('customer-phone').value;
    const address = document.getElementById('delivery-address').value;
    const note = document.getElementById('order-note').value;
    const total = calculateTotal();

    // รวบรวมเฉพาะรายการที่มีการสั่งซื้อ (> 0)
    const orderedItems = menuItems
        .filter(item => orderState[item.id] && orderState[item.id].qty > 0)
        .map(item => {
            const state = orderState[item.id];
            const isSpecial = state.type === 'special';
            const unitPrice = isSpecial ? item.priceSpecial : item.priceNormal;
            const typeLabel = isSpecial ? ' (พิเศษ)' : ' (ธรรมดา)';
            
            return {
                name: item.name + typeLabel,
                qty: state.qty,
                price: unitPrice * state.qty
            };
        });

    if (orderedItems.length === 0) {
        alert('กรุณาเลือกอาหารอย่างน้อย 1 รายการ');
        return;
    }

    if (!name || !phone || !address) {
        alert('กรุณากรอกข้อมูลการจัดส่งให้ครบถ้วน');
        return;
    }

    database.ref('orders').push({
        customerName: name,
        phone: phone,
        address: address,
        mapUrl: currentMapUrl,
        note: note || 'ไม่มี',
        items: orderedItems,
        totalPrice: total,
        status: 'รอร้านค้ารับออเดอร์',
        date: new Date().toLocaleDateString('th-TH'),
        timestamp: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
    }).then(() => {
        alert('สั่งอาหารเรียบร้อยแล้ว! ร้านกำลังเตรียมจัดส่ง');
        location.reload();
    });
}

renderMenu();
loadSavedInputs();
        loadSavedInputs();
    </script>
