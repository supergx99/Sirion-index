<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรับออเดอร์ร้านอาหาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-10">

    <!-- Header -->
    <div class="bg-orange-600 text-white p-4 shadow-lg text-center font-bold text-xl flex justify-between items-center px-6 sticky top-0 z-10">
        <span><i class="fa-solid fa-store mr-2"></i> ร้าน ศิริอรข้าวมันไก่ (รับออเดอร์)</span>
        <button onclick="downloadTxtReport()" class="bg-white text-orange-600 hover:bg-orange-50 text-xs py-1.5 px-3 rounded-lg font-bold shadow transition flex items-center">
            <i class="fa-solid fa-file-arrow-down mr-1"></i> โหลด .txt
        </button>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="font-bold text-gray-700 text-sm">รายการออเดอร์ทั้งหมด</h2>
            <span id="order-count" class="text-xs font-semibold bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full">0 รายการ</span>
        </div>
        
        <div id="order-list" class="space-y-4">
            <p class="text-center text-gray-400 py-8">กำลังโหลดรายการ...</p>
        </div>
    </div>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dudyadmit-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let rawOrdersData = {};

        database.ref('orders').on('value', (snapshot) => {
            const container = document.getElementById('order-list');
            container.innerHTML = '';
            
            rawOrdersData = snapshot.val() || {};
            const keys = Object.keys(rawOrdersData);
            
            document.getElementById('order-count').innerText = `${keys.length} รายการ`;

            if (keys.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-8">ยังไม่มีออเดอร์เข้ามา</p>';
                return;
            }

            const audio = document.getElementById('alert-sound');
            if (audio) { audio.play().catch(e => {}); }

            keys.reverse().forEach(key => {
                const order = rawOrdersData[key];
                
                const dateDisplay = order.date || new Date().toLocaleDateString('th-TH');
                const timeDisplay = order.timestamp || '';

                let itemsListHtml = '';
                if (order.items && Array.isArray(order.items)) {
                    itemsListHtml = order.items.map(i => `
                        <div class="flex justify-between text-xs py-1 border-b border-gray-100">
                            <span>${i.name} x <b>${i.qty}</b></span>
                            <span class="font-semibold">${i.price} ฿</span>
                        </div>
                    `).join('');
                }

                // สร้างลิงก์แผนที่ Google Maps อัตโนมัติ
                let mapLink = '';
                if (order.mapUrl && order.mapUrl.trim() !== '') {
                    mapLink = order.mapUrl;
                } else if (order.address && order.address.trim() !== '') {
                    mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}`;
                }

                const mapBtn = mapLink ? 
                    `<a href="${mapLink}" target="_blank" class="inline-block mt-2 bg-orange-100 hover:bg-orange-200 text-orange-800 text-xs font-bold px-3 py-1.5 rounded-lg border border-orange-300 transition">
                        <i class="fa-solid fa-map-location-dot mr-1"></i> กดเปิดนำทาง Google Maps
                     </a>` : '';

                const cardHtml = `
                    <div class="bg-white rounded-xl p-5 shadow-md border-l-4 border-orange-500 space-y-3 relative">
                        <button onclick="deleteOrder('${key}')" class="absolute top-3 right-3 text-gray-400 hover:text-red-500 p-1 text-base transition" title="ลบรายการนี้">
                            <i class="fa-solid fa-xmark"></i>
                        </button>

                        <div class="flex justify-between items-start pr-6">
                            <span class="bg-orange-100 text-orange-800 text-xs font-bold px-2.5 py-0.5 rounded">${order.status}</span>
                            <span class="text-xs text-gray-500 font-medium">
                                <i class="fa-regular fa-calendar-days mr-1"></i>${dateDisplay} ${timeDisplay}
                            </span>
                        </div>
                        
                        <div>
                            <h3 class="text-base font-bold text-gray-800">${order.customerName}</h3>
                            <p class="text-xs text-gray-600"><i class="fa-solid fa-phone text-blue-500 mr-1"></i> <a href="tel:${order.phone}" class="text-blue-600 font-bold underline">${order.phone}</a></p>
                            <p class="text-xs text-gray-600 mt-1"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> ${order.address}</p>
                            ${mapBtn}
                        </div>

                        <div class="bg-slate-50 p-3 rounded-lg border">
                            <p class="text-xs font-bold text-gray-700 mb-2">รายการที่สั่ง:</p>
                            ${itemsListHtml}
                            <div class="flex justify-between font-bold text-sm text-orange-600 pt-2 mt-1 border-t">
                                <span>ยอดรวมสุทธิ</span>
                                <span>${order.totalPrice} ฿</span>
                            </div>
                        </div>

                        <p class="text-xs text-gray-500"><b>หมายเหตุ:</b> ${order.note}</p>

                        <div class="pt-2 grid grid-cols-2 gap-2 text-xs">
                            <button onclick="updateOrderStatus('${key}', 'กำลังทำอาหาร')" class="bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700">กำลังทำอาหาร</button>
                            <button onclick="updateOrderStatus('${key}', 'กำลังจัดส่ง')" class="bg-amber-600 text-white font-bold py-2 rounded-lg hover:bg-amber-700">กำลังจัดส่ง</button>
                            <button onclick="updateOrderStatus('${key}', 'ส่งเรียบร้อย')" class="col-span-2 bg-emerald-600 text-white font-bold py-2 rounded-lg hover:bg-emerald-700">ส่งเรียบร้อย</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        });

        function updateOrderStatus(key, newStatus) {
            database.ref('orders/' + key).update({ status: newStatus });
        }

        function deleteOrder(key) {
            if (confirm('คุณต้องการลบรายการออเดอร์นี้ใช่หรือไม่?')) {
                database.ref('orders/' + key).remove();
            }
        }

        function downloadTxtReport() {
            const keys = Object.keys(rawOrdersData);
            if (keys.length === 0) {
                alert('ไม่มีข้อมูลออเดอร์ให้บันทึก');
                return;
            }

            let txtContent = "=== รายงานสรุปรายการสั่งซื้ออาหาร ===\n";
            txtContent += `วันที่ออกรายงาน: ${new Date().toLocaleString('th-TH')}\n`;
            txtContent += `จำนวนรายการทั้งหมด: ${keys.length} รายการ\n`;
            txtContent += "===================================\n\n";

            let grandTotal = 0;

            keys.forEach((key, index) => {
                const order = rawOrdersData[key];
                const dateDisplay = order.date || new Date().toLocaleDateString('th-TH');
                const timeDisplay = order.timestamp || '';
                
                txtContent += `[รายการที่ ${index + 1}]\n`;
                txtContent += `วันที่/เวลา: ${dateDisplay} ${timeDisplay}\n`;
                txtContent += `ชื่อลูกค้า: ${order.customerName}\n`;
                txtContent += `เบอร์โทร: ${order.phone}\n`;
                txtContent += `ที่อยู่: ${order.address}\n`;
                txtContent += `สถานะ: ${order.status}\n`;
                txtContent += `รายการอาหาร:\n`;

                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        txtContent += `  - ${item.name} x ${item.qty} = ${item.price} บาท\n`;
                    });
                }

                txtContent += `ราคารวม: ${order.totalPrice} บาท\n`;
                txtContent += `หมายเหตุ: ${order.note || '-'}\n`;
                txtContent += "-----------------------------------\n\n";

                grandTotal += Number(order.totalPrice || 0);
            });

            txtContent += `ยอดรวมการขายทั้งหมด: ${grandTotal} บาท\n`;

            const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `รายงานออเดอร์_${new Date().toISOString().slice(0,10)}.txt`;
            link.click();
        }
    </script>
</body>
</html>
